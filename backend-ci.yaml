# Workflow name
name: Backend Continuous Integration

# Triggers for the workflow
on:
  # Manual trigger using the workflow_dispatch event
  workflow_dispatch:

  # Automatic trigger on pull request events targeting the main branch
  pull_request:
    branches:
      - main

defaults:
  run:
    working-directory: ./starter/backend

# Jobs defined in the workflow
jobs:
  lint-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pipenv
        run: pip install pipenv

      - name: Install dependencies
        run: pipenv install  

      - name: Run Linter
        run:  pipenv run lint

  test-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pipenv
        run: pip install pipenv

      - name: Install Dependencies
        run: pipenv install

      - name: Run tests
        run: pipenv run test

  build-job:
    needs: [lint-job, test-job]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pipenv
        run: pip install pipenv

      - name: Install Dependencies
        run: pipenv install

      - name: Build Docker Image via CLI
        run: |
          docker build -t mp-backend:ci:${{ github.sha }} .
          docker images
          docker run -p 5000:5000 --name mp-backend:ci:${{ github.sha }} -d mp-backend:ci:${{ github.sha }}
          curl http://localhost:5000/movies
          docker logs -f mp-backend:ci:${{ github.sha }}
          docker stop
