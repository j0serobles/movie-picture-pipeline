# Workflow name
name: Backend Continuous Deployment

# Triggers for the workflow
on:
  push:
    branches:
      - main
    paths:
      - 'starter/backend/**'
      - '.github/workflows/backend-cd.yaml'
  workflow_dispatch:

defaults:
  run:
    working-directory: ./starter/backend

env:
  AWS_REGION: us-east-1                          # Replace with your AWS Region
  EKS_CLUSTER_NAME: cluster                      # Replace with your EKS cluster name
  ECR_REGISTRY: 419656091143.dkr.ecr.us-east-1.amazonaws.com  # ECR Registry name
  ECR_REPOSITORY: movie-picture-pipeline-backend # Amazon ECR repo name

# Jobs defined in the workflow

jobs:
  lint-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pipenv
        run: pip install pipenv

      - name: Install dependencies
        run: pipenv install  

      - name: Install dependencies flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Linter
        run:  pipenv run lint

  test-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pipenv
        run: pip install pipenv

      - name: Install Dependencies
        run: pipenv install

      - name: Install dependencies flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run tests
        run: pipenv run test

  deploy-job:
    name: Bulid, Push and Deploy
    needs: [lint-job, test-job]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Login to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
       
      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

       # Installs Kustomize and adds it to $PATH
      - name: Setup Kustomize
        uses: syntaqx/setup-kustomize@v1

       # Verify kustomize installation and set the image tag.
      - name: Run Kustomize
        run: |
          kustomize version
          kustomize edit set image backend=${IMAGE_URI}
        working-directory: ./starter/backend/k8s

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Deploy to Kubernetes
        run: |
          echo "${{ vars.KUBECONFIG }}" > kubeconfig.yaml
          kubectl version --client
           kustomize build | kubectl apply --validate=false -f - --kubeconfig=kubeconfig.yaml
        working-directory: ./starter/backend/k8s